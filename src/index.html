<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blockchain Rental Agreement DApp</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
      body {
        padding-top: 70px;
        background-color: #f8f9fa;
      }
      .card {
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border: none;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark fixed-top bg-dark flex-md-nowrap p-2 shadow">
      <a class="navbar-brand col-sm-3 col-md-2 mr-0 font-weight-bold" href="#">🏡 Rental Agreement DApp</a>
      <ul class="navbar-nav px-3 ml-auto">
        <li class="nav-item text-nowrap">
          <span class="navbar-text text-light">Account: <strong id="account" class="text-warning">Connecting...</strong></span>
        </li>
      </ul>
    </nav>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="sr-only">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Connecting to Blockchain & Smart Contracts...</p>
          </div>

          <div id="content" class="card p-4" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3 class="card-title text-primary mb-0">Blockchain Rental Contract</h3>
              <span class="badge badge-success px-2 py-1">Ganache Connected</span>
            </div>

            <p class="mb-2"><strong>Contract Address:</strong> <small id="contractAddress" class="text-muted font-monospace">Loading...</small></p>
            <p class="lead"><strong>Stored Status / Value on Blockchain:</strong> <br><span id="value" class="badge badge-info p-2 font-weight-bold mt-1" style="font-size: 1.1rem;">...</span></p>

            <hr>

            <h5 class="mt-4">Update Agreement Data</h5>
            <form onSubmit="App.set(); return false;" class="mt-3">
              <div class="form-group">
                <label for="newValue">New Value / Status Description</label>
                <input id="newValue" class="form-control" type="text" placeholder="e.g. Agreement Signed by Landlord & Tenant" required></input>
              </div>
              <button type="submit" class="btn btn-primary px-4">Update Blockchain State</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@truffle/contract@4.3.31/dist/truffle-contract.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
